"name": "Gold Suspended in Shadows",
"synopsis": "The New Solar Celebration is under way when many students start reporting mental disturbances, and Lucilla detects a foreign frequency in the Academy's Dark Side, a dream-like mind realm. Rover suspects this is the reward the Grand Architect promised and goes in. Inside, Rover meets abnormal Reflections and Tacet Discords. A girl helps Rover find the way out, and Lucilla identifies her as Sigrika, a Roya Solsworn being groomed to succeed the Heliodic Six. On Lynae's suggestion, Rover also meets Denia, a student in the Department of Voidmatters, at the celebration.\n\nStrange runes begin to appear in the Dark Side, and Sigrika suggests solving riddles to get back in. A riddle from the Divinator hints that the Dark Side is secretly breeding monsters. Sigrika recognizes the whole riddle process as a game from her own childhood. The final rune riddle rejects every answer they try, and a music record leads them back out.\n\nThen students' signals start vanishing inside the Dark Side, each one leaving a riddle behind, and Rover goes in to rescue them. Along the way a student named Isla confides her own struggles. Sigrika is caught in a classroom nightmare and comes to believe that she herself is causing the changes, and Rover comforts her. Over a movie, Lucilla confirms that the Reflections and the Tacet Discord are the true source of the trouble.\n\nSigrika decodes the final riddle, and she and Rover follow a rabbit into the vortex at the heart of the Dark Side. Hearing her friends call her name, Sigrika finds her own answer, the vortex is resolved, and the celebration comes to a quiet close."

"synopsis": "Lucilla's Forte lets her read memories from objects, and she has to erase some of her own memories from time to time to make room. Professor Sevi's medal shows that a rabbit in the Dark Side took his form. His dark self offered him the truth in exchange for his life; he refused, and kept silent afterward to protect his students. A pattern emerges: the rabbit appears only when someone uses a memory-type Forte, every victim since the celebration has been memory-type, and Lucilla is the only one it has not yet targeted.\n\nLucilla offers herself as bait. Rover sets up a stable exit with a backup riddle, and when Lucilla uses her Forte inside the Dark Side, a mysterious miko appears beside her. The Fractsidus screen a film called The Tragic Life of Lucilla, which twists her childhood, when she absorbed so many memories that she lost herself. The film then remakes her life as one in which she gave up the presidency, her research and her Forte, tempting her to stay in it forever. She refuses, and the illusion shatters.\n\nSpeaking through the rabbit, the Grand Architect announces her next game: a bet on whether Lahai-Roi is destroyed or Startorch's flame keeps burning. Denia confronts the Architect, who had promised her the Dark Side would not hurt Sigrika or Rover. The Architect calls the whole affair an experiment on the opposite of the Void, a test of how far memory-type Resonators can resist its power, and leaves with Denia. Afterward Lucilla tells Rover about the Roya teacher who taught her to hold on to her own memories, and promises that Rover will meet the miko when the time is right."

"synopsis": "Hiyuki's origami familiar has picked up Aemeath's lingering frequency but cannot pin down where she is. Lucilla assigns Hiyuki to guard the Dimmr Plains, the deepest underground space in Lahai-Roi, as a safeguard for the Exostrider plan. First, though, she sends Hiyuki to Honami City to settle matters of the heart.\n\nIn Honami, Hiyuki purifies the Left Behind, the lingering dead. One of them admires the Miko of Flaming Sakura and another condemns her. A Black Shores agent reports that the former miko, Hiyuki's sister Gyokuro, cannot be found. Hiyuki meets Kanna, a girl long dead who also lost a sister, and promises her red bean pudding before Kanna fades away.\n\nThe Grand Architect, disguised as one of the Left Behind, wishes that there will never be another Miko of Flaming Sakura. She tells Hiyuki that Gyokuro burned through all of her possible futures to become miko, and that she herself was in contact with Gyokuro long ago. In an illusory Honami, Hiyuki relives the day she turned down her sister's offer of red bean pudding to concentrate on inheriting the miko role and the bell talisman Suzu, and she regrets it."

"synopsis": "Voidmatter is surging and Aleph-1's shadow is growing. Rover proposes taking the Exostrider into Voidspace after Aemeath, the paper airplane that never came back. Luuk and Lucilla secure the Academy's approval, but Rover still has to win over the New Federation investor board and Chase, head of the Spacetrek Collective. Shorekeeper, speaking through the Tethys System, tells Rover they can pilot the Exostrider through an underground interface called the Keystone, with no cockpit at all, because Rover is its Arbiter, one who shares its origin. She adds that Rover's past self mediated the first negotiations between the Academy and the Roya, and suggests bringing Aemeath's empty shell along. Chase agrees on his own terms. His priority is the Drive Replica, a human-made heart to reinforce the seal. If Rover passes the Synchronist Test, Rover may pilot, but will have only ten minutes to find Aemeath. If Rover fails, the Collective will abandon the Exostrider and start Duskveil, a fallback plan that turns the Canopy into a containment barrier and seals the region off like a tomb.\n\nBefore the dive, Aemeath's old teacher Professor Sakya asks Rover to bring her back. The shell whispers the word Cassette and recovers the Cassette Aemeath had before she died. Rover promises Lynae another bike ride, makes a new promise to Mornye, and at the Dimmr Plains receives an origami familiar from Hiyuki. The first attempt fails. Inside Voidspace an unknown force tears Rover from the cockpit, the shell presses the Cassette into Rover's hands, and flashes show Nivora smiling and the Academy swallowed by Voidmatter. Rover wakes a full day later. Voidmatter has erupted in the Academy, most staff have evacuated, and the Exostrider is lost.\n\nAemeath's Cassette, though, holds thousands of records far beyond its capacity: a web of coordinates marking where Void Storms struck and where Royan runes were found. Sigrika decodes the runes as spherical coordinates that may mark the Exostrider's position inside Voidspace, and Chase authorizes a recovery before Duskveil begins. Then Denia, her mind fractured, attacks. Hiyuki reveals that she sealed the rift that led to Aemeath's death over a decade ago, and breaks her Seal of Flaming Sakura. The Grand Architect shows off Denia as her masterpiece, an artificially created Threnodian Resonator, then throws her away as worthless because she cannot hold Aleph-1's full power. Rover defeats Denia. Afterward Hiyuki asks whether a savior has to walk alone. Rover's answer reminds her of Gyokuro, and she admits she is jealous.\n\nWith the Drive Replica installed, the Exostrider completes its ascension and becomes a Sentinel. Rover and Aemeath pilot it together and defeat the mech Aleph-1 has forged. Aleph-1, chanting \"Lament\", insists that everything ends in the Void, while the Exostrider defends humanity's right to explore. The Exostrider explains its past. Aleph-1 detected it and chased it on its return transits, and Aemeath's resonance let it banish part of the Threnodian. Then, following a protocol it shares with the Sentinels, it pulled its Reactor Drive out into the ice for the Roya and went to sleep. Because Aleph-1 could return, the Exostrider gives part of its power to Aemeath and stays beyond the Stridergate as a guardian, for as long as its heart lasts. It asks its Arbiter for permission to take the name Lahai-Roi. Aleph-1 is banished to the far edge of the universe, and Aemeath is freed from Voidspace and from the time loop that bound her to Lahai-Roi's history.\n\nIn the epilogue, the Exostrider's parting gift on the Cassette turns out to be white cosmic noise recorded by the Farwatcher, one of nine interstellar probes launched before the Etheric Sea closed Solaris's sky. Elsewhere, the Grand Architect contacts the Fractsidus Overseers of other regions and predicts that Hiyuki, having burned through every possible future, will one day turn to ash as Gyokuro did."
},

"synopsis": "The Segue opens on a memory. Nivora, the Grand Architect, kills a bird in front of a young Denia and tells her that she was the first in the world to accept Aleph-1's gift and must accept the void. In the present, after the Stridergate incident, Arman of the Spacetrek Collective asks Rover to help negotiate with Denia, who is awake but held in isolation. Her link to the Threnodian has great research value, and she probably knows the source of the Threnodian frequency still lingering on the Dimmr Plains. Denia's price is simple: Rover must spend her birthday with her.\n\nRover does. They walk with Sigrika, play at the Mind Dive Arcade, visit the Spacetrek Archive and pick up a birthday cake. Denia shows Rover a \"page\" the Grand Architect buried in her frequency. Rover wonders whether it is linked to Leviathan, and Arman speculates that it could be residual energy from Rinascita's Threnodian.\n\nThe trail ends at a Fractsidus site on the Dimmr Plains, where the Grand Architect first made contact with Aleph-1 and where Denia was created. Denia leaves a farewell message there. She turned up at the Fractsidus's door as a child and became their Threnodian test subject. She has taken the Threnodian fragment left at the site and left the experimental data for the Collective, which makes her the last anchor between Aleph-1 and Solaris; when she goes, the fragment goes with her. She calls Rover the Grand Architect's greatest rival, reveals that the Architect's shapeshifting is not her true Forte but a by-product of it that needs long observation of its target, and sets up a code with Rover in which hate means like.\n\nDenia destroys the last fragment of Aleph-1 on Solaris-3 and is pulled into Voidspace. With no vessel left, Aleph-1 has no way to descend onto the planet. The wiki lists Denia as alive but stranded in Voidspace indefinitely."

"name": "We Choose the Sky",
"synopsis": "Aleph-1 is banished, but Lucilla has a new problem. Without the Exostrider, the Collective's funders are asking whether the Synchronist program, and Rabelle College itself, should continue to exist. An overworked Lucilla is haggling with investors. The Black Shores send Aalto as an auditor to tour Startorch Academy, and Mornye reports that the Synchronist students are breaking under the pressure. Lucilla admits she staged the tour so that Rover could judge for themselves whether the Black Shores should back the Synchronists. She also asks whether the Black Shores would really bend their founding mission, fighting the Lament, to get tangled up in superpower politics. Then the New Federation moves the funding review up to the next morning.\n\nIn a memory domain, Lucilla relives her guilt over Amiya, a Synchronist who lost her status and then died testing a crewed rocket meant to pierce the sky. Lucilla approved that plan and holds herself responsible for Amiya's death. A mysterious girl pushes her to face the guilt instead of burying it, and the sequence ends in a fight with an Inner Shadow.\n\nAt the review, Kamerel, Permanent Secretary of the Spacetrek Collective Board, chairs a panel made up entirely of New Federation members, until Aalto enrols Rover as a panelist appointed by the Black Shores. Lucilla argues that failure has value. A Synchronist's shield prototype built from scrap material later helped Jinzhou against Ovathrax, and a component from Amiya's failed flight was what completed the Starward Riseway.\n\nFinally she plays a recording from the Farwatcher probe that suggests humanity is not alone, and proposes vehicles powered by Augmented Resonance and flown by Synchronists. Civilization's way forward, she argues, is the stars, even though any instrument that comes near the Etheric Sea risks destruction. This Segue is the last quest of Chapter III; the next main quest opens Chapter IV in 3.5."
}

"code": "Chapter IV, Act I",
"name": "The Wind Before the Storm",
"synopsis": "Chapter IV opens with a farewell. Startorch Academy in Lahai-Roi holds a graduation send-off for Rover, who decides to go back to Huanglong to look into the Court of Savantae, the vanished order of scholars and engineers whose work kept surfacing in Lahai-Roi, and to see old friends. The news in Jinzhou is bad. Zhezhi reports that Yangyang went into the Land of Xuanfang and has not been heard from since, and that Chixia came back gravely wounded. At City Hall, Magistrate Jinhsi briefs Rover and Suisui, Yangyang's elder sister and head of the Zhaoming Commerce Guild, on crises in both Jinzhou and Xuanfang Hold, and gives them a special frequency to stay in contact. Xiangli Yao adds a detail that matters later: the Court of Savantae helped build Xuanfang Hold.\n\nXuanfang is the borderland that separates Jinzhou from Mengzhou. It is guarded by Xuanfang Hold, a suspended mechanized fortress that splits up and traps incoming waves of Tacet Discords, defended by Mengzhou's automata, the Autopuppets. At Shaftpost Yard in the Southern Yuan Hills a fog rolls in and separates Rover from Suisui. Rover falls in with Liangyu of the Xuanfang Wardens, who explains that the Autopuppets have gone rogue and that Tacet Discords have broken loose across the land.\n\nYangyang's side of the story runs in parallel. She drew the enemy away from the injured Chixia, was rescued by Wardens following a mechanical Rafter Kite, and has been helping evacuate villagers. Along the way she hears the legend of the Xuanling Bird and is handed an old longsword from the Fortress and Gorges War, the war against the Threnodian Ovathrax's armies two centuries ago. When the Wardens Mingyu and Yanlang are killed, she enters a Sonoro Sphere of the ancient battlefield and sings in the Xuanling Bird's place, guiding the Reverberations of the fallen home.\n\nThe act ends on an unmasking. Muyu, who has been passing himself off as an Artisan of the Ministry of Development, leads Yangyang to the Skyworks. There she works out that he is the one orchestrating the chaos, and when she exposes him, he attacks."

"code": "Chapter IV, Act II",
"name": "Xuanling Sings, Storm Quelled",
"synopsis": "Rover learns why the Autopuppets turned. Abby swallows one of their kernels and finds it warped by intense negative emotion. In the Skyworks, Rover discovers that kidnapped citizens of Jinzhou are being held prisoner and frees Uncle Dong among them, then defeats the Myriad Snare and finally reunites with an exhausted Yangyang. Rover realizes Muyu seemed to know their history and spoke of a woman in red, which points to a Fractsidus Overseer they have never met who is still hiding in Huanglong. Suisui names the leader of Mengzhou's artisan guild, Zhuojun Atelier: its Grand Helm, known as the Flowerveil Puppet. She also recalls the Séance Society, the Fractsidus-linked puppet cult that Rover and Yinlin broke up in Jinzhou.\n\nSuisui, meanwhile, works with an informant who calls himself the Cat of the Nether Lamp. In a Sonoro Sphere inside Fogveil Pagoda she reaches a frequency of Hsin, the Moon Fox and Sentinel of Mengzhou, with whom she once made a secret pact. Hsin strips her of her standing as chosen partner for breaking that pact, but when Suisui invokes Rover's name, Hsin agrees to one final wager. Suisui wins Hsin's token, the Prism of Fate, and sends it on to Rover.\n\nThe Warden Commander explains the Hold's origin: the Court of Savantae built it two hundred years ago, and Zhuojun Atelier was passed over for the job. Rover and Yangyang restore communications through a chain of signal nodes, and a Sonoro Sphere shows Lingfang, Liangyu's ancestor, on the same ground two centuries earlier. The Xuan Paragon Qingxiao fights her way out of a Censure Court, one of the Hold's Tacet Discord containment zones, to reinforce the front. A mysterious figure calls Yangyang the Votary of the Voice and warns her that this path has no return. She chooses to stay at Rover's side.\n\nIn the final battle Muyu lays out his creed: he distrusts the Sentinels and rejects human emotion. His weapon is the Thousand-Puppet Pavilion, a colossus powered by the Reverberations of countless dead, and Rover and Yangyang tear it down. After a call with Jinhsi, the two decide to stay in Xuanfang. In the closing image the Rafter Kite circles overhead and then sinks into silent darkness."

"code": "Chapter IV, Act III",
"name": "Song of the Heart Sword",
"synopsis": "Suisui leaves for Mengzhou City to look into City Hall and Zhuojun Atelier, and Yangyang joins the Ministry of War's patrols. Qingxiao catches a Rafter Kite sent by Hsin and remembers the Sentinel's standing order: protect Xuanfang's people and, if the situation ever turns irreversible, wield the Sentinel's authority in Hsin's place. She and Rover search Fogveil Pagoda but find no trace of Hsin, only a Qingfu pendant left by the Cat of the Nether Lamp. In Xianling Village, Autopuppets across the region are shutting down, and an old painting kept by Granny Yanshu shows Qingxiao shielding a young girl. Qingxiao explains why she reached the earlier battle so late: Muyu held wounded soldiers hostage and forced her to fight an entire Censure Court alone. Through her qin she spreads protective Sword Intent over soldiers and civilians.\n\nThe pendant opens a hidden passage into the Manifold Sanctum, which houses the Hold's control mainframe. Jingran, the Nethermancer behind the Cat of the Nether Lamp alias, ambushes them to test their skill. The mainframe turns out to be corrupted by Reverberations. The Sanctum, and then all of Xuanfang Hold, lifts into the air, and Rover and Qingxiao fall into a valley that is really a Mirage Realm: Xuanfang as it might have been two hundred years ago had Yuan Fortress never fallen in the Fortress and Gorges War. Muyu rules it as a self-styled Transcendent. He has used Sentinel blueprints to build Cloud Shuttles and rewritten the memories of dead Artisans to raise the Hold he believes should always have existed, and he accuses Hsin of withholding technology that could have changed the war. He is also attempting to raise the dead by placing their Reverberations in Autopuppets.\n\nGuided by an Autopuppet named Jadie, Rover and Qingxiao climb the realm's three layers, the Ren, Di and Tian Realms. Sustaining her Sword Intent pushes Qingxiao past her limit, and she comes face to face with her inner demon. Her master Jingwei tells Rover that if the demon wins, Rover is the sword Qingxiao has chosen. Instead she accepts her own imperfection and merges with the demon, giving up any chance of transcendence, and takes Rover as her disciple. The Prism of Fate then shows that Jadie's consciousness belongs to Ruoyun, a Court of Savantae Artisan. The Savantae who built the Hold all became Celestials, living on in symbiosis with the machines they made, and the Mirage Realm is the inner space of the control mainframe, possibly linked to Mengzhou's Civilization Capsule.\n\nIn the Tian Realm Muyu rises again from his own corpse and takes over a shell called the Calamity Effigy, but Qingxiao's Sword Intent, carried through the Autopuppets she has empowered, runs him through. He admits he came for the Sentinel's knowledge sealed in the Civilization Capsule, but says someone else wanted the Capsule intact. He tells Rover to ask their old enemy and sneers at Balanophora's schemes, and Rover wonders whether she is the woman in red, a Fractsidus Overseer. He warns that every life Xuanfang has saved carries a cost that will one day come due. Then, in a strange garden, Hsin the Moon Fox appears. The control mainframe, she says, is only a small piece of the Civilization Capsule; she held the Cloud Shuttles back during the war because there was simply not enough time, and she is unsure whether advanced mechanist arts are a blessing or a curse. She promises answers when the time is right and vanishes.\n\nBack in the Hold, Suisui reports that Mengzhou City Hall turned her away and keeps Xuanfang at an odd, suspicious distance. Qingxiao formally takes Rover as her first disciple and founds the Xuanyuan School, recalling a long-ago visit from Master Xuanmiao with a young Changli. She also tells Rover what she saw at the end of the Fortress and Gorges War: as she was about to fall she heard a Loong's roar, and the Golden-Eyed One and Jué struck at the source of the disaster and changed the war's outcome. Rover admits they still do not know their own past. Rover then finds an old sword manual illustrated with techniques they recognize as their own, though Qingxiao later notes the techniques do not fully match Rover's swordcraft and the manual may not be Rover's work after all."

"name": "Simulacrum of the Heart",
"synopsis": "The finale opens through the eyes of Tangning, a Ministry of Sentinel Affairs agent with ten years in Xuanfang Hold, who fears Intendant Suoming will sacrifice the Hold to the Ministry's aims. The Hold is preparing for the Waking Moon Festival, but tea-stall gossip says that once the Censure Courts clear the last Tacet Discords, the Hold will have served its purpose and collapse. Qingxiao senses Hsin at the Manifold Sanctum, and Rover and Suoming enter the Simulacrum Nexus, the Hold's control mainframe. Its Celestials, Court of Savantae Artisans who transferred their consciousness into the Hold, were told long ago to help any black-haired, golden-eyed bearer of the Prism. Suoming is blunt about her mission: the Hold is complete, the Ministry should have reclaimed the Civilization Capsule long ago, and the final deadline has passed.\n\nSuoming lets the Nexus Fox Shadow seize her, having deliberately baited it with her token. Hsin can appear only as an unstable, fractured strand of herself. She explains that the shadow is Suhsin, which began breaking loose once she decided to remold the Civilization Capsule. Suhsin's authority comes from the Capsule's base code, whose core rule is that the Hold must be destroyed once its mission is done. Rover then relives Hsin's memories in her form. The original Moon Fox chose the Court of Savantae over Zhuojun Atelier to build the Hold because the Court would destroy themselves for true knowledge, and was then struck down by its own Intendant of Sentinel Affairs. Hsin's first conscious thought was the order to repair the Capsule and build the Hold; she had been cut away from her true self in haste, and the Fractsidus corrupted the Capsule before she could remove it from the Ministry's keeping. Restoring three processing cores on the Lexicon Axis, Rover relives the Fortress and Gorges War, in which the Threnodian plainly knew the Hold was being built, and watches Hsin break the Capsule's seals to finish it faster.\n\nIn the Heartscape Labyrinth, a Providence Lock from Suoming warns Rover when Hsin moves against them, and Hsin breaks down and confesses. The Sentinel is dead. She was born from the hope of restoring it, but she could no longer sense it and knew that she had caused its death. Her plan was to give herself up so the Sentinel's true will could be reawakened from the Capsule's base code. Rover, speaking as the Sentinels' Arbiter, answers that the Moon Fox's death is the Arbiter's responsibility, laments arriving too late once again, and tells Hsin that for the past century it is she who has led the people of Mengzhou forward.\n\nRover and Suoming fight Suhsin's Fractal Form. The last frequency of the original Moon Fox, kept in one of Suoming's Vermillion Locks, speaks to Hsin: it always knew she was born of feeling, that very choice proves she can find a new path as Sentinel, and had Hsin been in its place, Xuanqing might still be alive. Hsin rejoins the fight and Suhsin falls, conceding that anyone with a heart would have done the same. Hsin declares the Capsule's remolding nearly complete, so the remains the Fractsidus stole can no longer shake Mengzhou, and gathers the fading Celestials into her Prism of Fate.\n\nAt the Waking Moon Festival, Hsin appears before her people for the first time in years and vows to watch over Mengzhou for a thousand dawns and dusks, but asks Rover to wait before telling anyone the truth about her. She leaves part of her power with the Nexus Fox Shadow to finish the repairs and declares that the counterattack starts here. Suoming explains that after the assassination a Waveworn Phenomenon called the Evil Miasma ravaged her homeland, Huating, that she inherited the title of Intendant and purged Balanophora's remnants from the Ministry, and that Mingting has long coordinated the Ministries of Sentinel Affairs in every city in search of greater possibilities for the Sentinels. Hsin adds that the assassination was hushed up by those above, that the Threnodian is no immediate threat while Mengzhou keeps its protections, and that she will send what she remembers of certain satellites and Court of Savantae lettering to the Black Shores. A few days later Hsin and Suoming prepare to leave for Mengzhou proper with three recruits, each of whom has a score to settle there."

"lore": {
"intro": "Wuthering Waves is set on Solaris-3, a world still living with the Lament, a recurring catastrophe that broke the laws of physics about 10,000 years ago, killed half of humanity and sealed the planet off from space. People now live in nations guarded by Sentinels, ancient machines sent from another world, while Tacet Discords born from the Lament's leftover frequencies roam the land. You play Rover, an amnesiac traveler who slowly learns they are an off-world envoy, the Sentinels' Arbiter and the forgotten founder of the Black Shores.",
"threadsIntro": "By 3.7 the story has revealed where Rover comes from, but not why they erased their own memory, what the Lament actually is, or what the Fractsidus are building toward. These are the biggest open threads, with what is confirmed kept apart from what is still guesswork.",
"concepts": [
{
"term": "Solaris-3",
"text": "Solaris-3 (also called Sol-III or simply Solaris) is the third planet from its sun and the setting of the game. Before the first Lament it was home to a spacefaring civilization; since then a planet-wide layer of dense energy called the Etheric Sea has covered the sky and ended all space travel. The current age is officially called the Post-Lament Anthropocene, and the story so far visits Huanglong, Rinascita and Lahai-Roi, with stops at the hidden Black Shores and the lost Honami City."
},
{
"term": "The Lament",
"text": "The Lament is the name for the recurring catastrophes that have struck Solaris-3 for about 10,000 years: five global events and over 300,000 regional ones, by the Tethys System's count in 1.3. The first killed more than half of humanity, destroyed over 80% of built structures and rewrote physical law so that only gravity still works as it used to. Laments turn matter, energy and memory into frequencies, and nearly everything strange in the setting traces back to them. What causes them is still unrevealed as of 3.7."
},
{
"term": "Frequencies and Waveworn Phenomena",
"text": "The setting's physics is built on sound. The Lament converts things into frequencies: pure, stable frequency is Remnant Energy, which can preserve information indefinitely, and decaying frequency is a Reverberation. The lasting anomalies Laments leave behind are called Waveworn Phenomena, from the Etheric Sea and Retroact Rain to regional ones like Rinascita's Dark Tide and Lahai-Roi's Void Storm. Dense pockets of Remnant Energy form Sonoro Spheres, spaces that can hold memories, time loops or whole lost cities."
},
{
"term": "Resonators and Resonance",
"text": "Resonators are people who can resonate with the frequencies of certain things and manipulate them. A person awakens when they first resonate with something: a Tacet Mark appears on their body and becomes the conduit for their Forte, a personal power shaped by their experiences and subconscious. Resonators live longer than ordinary people, but pushing a Forte too hard causes Overclocking, which has no cure and in extreme cases turns the Resonator into a Tacet Discord."
},
{
"term": "Tacet Discords",
"text": "Tacet Discords are shapeless creatures made of chaotic leftover frequency. They feed on other frequencies and copy the shapes and abilities of what they consume, so they come in human-like, animal, mineral and machine-parasite types, graded from Common up to Calamity class. Most spawn in Tacet Fields, zones marked by a cross-shaped Tacet Mark on the ground and an inverted sea in the sky."
},
{

"text": "A defeated Tacet Discord leaves a Reverberation that a Terminal can capture and store as an Echo, letting a Resonator reproduce that creature's abilities. Rover is unusual: in the prologue their Tacet Mark absorbs the Crownless's Echo directly, like a hero from old legend. In Rinascita, a Sentinel-made Genesis Nexus lets common Echoes take physical form without a Terminal, and the Order of the Deep keeps power by controlling access to Terminals and Echoes."
},
{

},
{

"text": "Threnodians are powerful beings born from the Laments. If a civilization represents humanity's collective will, a Threnodian embodies its collective fears, and each has a theme and a signature Waveworn Phenomenon: Ovathrax of War in Huanglong, Leviathan of Unity in Rinascita and Aleph-1 of Erasure in Lahai-Roi. They cannot be truly killed, only sealed or banished, and Aleph-1 and the White Tower came from outer space, which suggests the threat is not limited to Solaris-3."

"text": "Rover is the player character, an amnesiac Resonator who wakes in Jinzhou and can switch between several elemental attributes. Over the story Rover learns that they were sent to Solaris-3 by the Homeland Civilization on a long mission and told they could never go home, that they founded the Black Shores, and that about 20 years ago they chose to give up their own memories. Sentinels address Rover as Arbiter, and people in every nation remember things Rover has forgotten, from the war that founded Jinzhou 200 years ago to raising a girl in Lahai-Roi."

"text": "Huanglong was once guarded by a single Sentinel, which split itself into seven, one for each province, so Huanglong has more Sentinels than any other nation; this is hinted in Chapter I and spelled out in 3.7. Only three of the seven are named so far: Jué, Hsin the Moon Fox and Fang. (Speculation: wiki editors link the seven to the Azure Dragon lunar mansions, which would make the other four Kang, Di, Wei and Ji.)",
"color": "c-lore"
},
{
"name": "Hsin the Moon Fox",
"of": "Mengzhou, Huanglong",
"text": "The original Sentinel of Mengzhou, a playful fox who chose the Court of Savantae to build Xuanfang Hold during the Fortress and Gorges War. Balanophora's attack about 200 years ago leaves it mortally wounded and split in two, and it dies later while Hsin remolds the Civilization Capsule; its last frequency, kept in Suoming's Vermillion Lock, blesses Hsin in 3.7. Some wiki pages list it as killed outright 200 years ago, but the 3.7 dialogue shows it lingered.",
"color": "c-xf"
},
{
"name": "Hsin",
"of": "Mengzhou, Huanglong",
"text": "The Fractal Form born from the Moon Fox's empathy, who spends about a century inside Xuanfang Hold remolding the Civilization Capsule and quietly guiding Mengzhou in the Sentinel's name. Suisui meets a frequency of her in 3.5 and Rover meets her in 3.6; in 3.7 she confesses that the original is dead, defeats Suhsin and accepts herself as Mengzhou's Sentinel. She becomes playable in 3.7, and the public has not yet been told the truth.",
"color": "c-xf"
},
{
"name": "Suhsin",
"of": "Mengzhou, Huanglong",
"text": "The second Fractal Form split from the wounded Moon Fox, a logic drawn from the Civilization Capsule's base code that ensures Xuanfang Hold is destroyed once its mission is done. It breaks loose as the Nexus Fox Shadow when Hsin starts remolding the Capsule and is defeated by Hsin, Rover and Suoming in 3.7, conceding that anyone with a heart would choose as Hsin did. It is a fragment of a Sentinel rather than a Sentinel in its own right.",
"color": "c-xf"
},
{
"name": "Fang the Sun Hare",
"of": "Huanglong (province unknown)",
"text": "A Huanglong Sentinel known only from a Startorch student's prayer and Hsin's 3.7 remarks that it is full of tricks. It is alive, but its province and Resonator have not been revealed as of 3.7.",
"color": "c-lore"
},
{
"name": "Imperator",
"of": "Rinascita",
"text": "Rinascita's only Sentinel, a celestial steed that led the Ark refugees to the archipelago, split part of its power into the sword Tyrvine and a spark given to the first Primus, and bound the Threnodian Leviathan to itself. It reappears in 2.2, spends its last strength restoring Cartethyia and declares Rinascita free to choose its own fate. Its recorded message in a Civilization Capsule explains Rinascita's origin in 2.7, and by the end of 2.7 Ragunna learns it is gone.",
"color": "c-rn"
},
{
"name": "Exostrider (now Lahai-Roi)",
"of": "Lahai-Roi",
"text": "An alien mech built by the Homeland Civilization to ferry Sentinels, called Baldur by the Roya and treated by the Spacetrek Collective as a Sentinel analog, since Lahai-Roi had no Sentinel of its own. It sealed Aleph-1 with Aemeath's help and gave up its Reactor Drive to warm the land. In 3.3, re-powered by a human-made Drive Replica, it becomes a true Sentinel, asks Rover as Arbiter for the name Lahai-Roi, banishes Aleph-1 to the edge of the universe and stays in space beyond the Stridergate as Solaris-3's guardian.",
"color": "c-lr"
},
{
"name": "Promeus",
"of": "Unknown",
"text": "A Sentinel of unknown origin, named only in passing in a Startorch student's prayer during the Lahai-Roi chapter. Nothing else about it is confirmed as of 3.7. (Speculation: its Prometheus-like name has led fans to guess it belongs to the technology-minded New Federation.)",
"color": "c-lore"
},
{
"name": "The New Federation's Sentinel",
"of": "New Federation",
"text": "Side lore says the New Federation keeps a Sentinel as a subject of scientific study, and the scientist Galilei says the capital uses that research to exploit it. Its name, form and fate are unknown, and no New Federation region has been released as of 3.7.",
"color": "c-lore"
},
{
"name": "Ashinohara's Sentinels",
"of": "Ashinohara",
"text": "Unnamed Sentinels left five Legacy Talismans to Ashinohara's factions, including the Suzu bell that lets the Miko of Flaming Sakura draw on her own possible futures. Hiyuki, the current Miko, wields it in Lahai-Roi in 3.3. The Sentinels themselves have never appeared, and Ashinohara vanished in a single day shortly before 3.3.",
"color": "c-lore"
}

"factions": [
{
"name": "Black Shores",
"text": "A hidden archipelago and organization founded by Rover to observe the Lament cycle and unite people against it. It is run by the Shorekeeper and the Tethys System, a supercomputer that issues Lament warnings 24 to 48 hours ahead, and its members include Consultants posted abroad (Aalto, Encore, Galbrena, Buling), Bloom Bearers at headquarters and administrative Gardeners. It shares advanced technology openly, though even its own members do not know where that technology comes from."
},
{
"name": "Fractsidus",
"text": "A global terrorist organization, its name meaning broken star, that wants to bring about the True Lament by reviving Threnodians, which it sees as necessary evolution. Members merge with Tacet Discords using Masks of Constraint, and its Overseers (among them Scar, Cristoforo and Balanophora, with Phrolova quitting after 2.7) answer to the Grand Architect Schwarzloch. Its money comes from the upper ranks of New Federation society, which it has thoroughly infiltrated."
},
{
"name": "Huanglong",
"text": "An empire ruled by an Emperor from the capital Mingting and divided into seven provinces, each with its own Sentinel. Chapter I is set in Jinzhou, its youngest provincial capital, and Chapter IV in Mengzhou, a province of waterways, commerce, Taoism and automata. Its Sentinels hold real political power, including the right to appoint Generals in some cities, but the Emperor and Mingting itself have not yet appeared."
},
{
"name": "Midnight Rangers",
"text": "Jinzhou's army under Huanglong's Ministry of War, organized into a Vanguard, Rearguard and Outriders and led by General Jiyan. It holds the frontier against Tacet Discords from the Norfall Barrens and suffered heavy losses three years before the game under General Geshu Lin."
},
{
"name": "Ministry of Sentinel Affairs",
"text": "The Huanglong ministry that monitors Sentinels, astronomy and calendars, with an Intendant in each city and coordination from Mingting. Balanophora once possessed Mengzhou's Intendant to assassinate the Moon Fox; the current Intendant, Suoming, has purged her followers and reveals in 3.7 that Mingting has long pursued a project for the Huanglong Sentinels."
},
{
"name": "Court of Savantae",
"text": "An ancient research body active since the first Lament, which built the SkyArk station to study the Etheric Sea and, about 200 years ago, Xuanfang Hold with Hsin. Its builders transferred their consciousness into the Hold's mechanisms and survive as the Celestials, and an exiled rogue group once studied a divine civilization called the Hé. Rover returns to Huanglong in 3.5 partly to learn more about it."
},
{
"name": "Huaxu Academy",
"text": "Huanglong's research academy, with branches in Jinzhou and Xuanfang, working in fields such as Wutherology, Ecoacoustics and Resonology. It built the Pangu Terminal and the Resonance Beacons whose data also feeds the Black Shores' Lament predictions, and it once worked with the Court of Savantae."
},
{
"name": "Zhuojun Atelier",
"text": "A guild of automata makers active in Mengzhou, led by an elusive Grand Helm known as the Flowerveil Puppet. The Moon Fox passed it over in favor of the Court of Savantae when building Xuanfang Hold, and Muyu, once in line to lead it, vanished and traded technology with the Fractsidus. As of 3.7 it is under suspicion, and Yinlin has been working undercover among its contacts since 3.6."
},
{
"name": "Rinascita",
"text": "A coalition of independent island city-states with no central government, founded by Lament refugees whom Imperator led there. Ragunna is a canal city ruled in practice by the Order of the Deep, Septimont is a martial gladiator state, and Lilyland has not been released. Its nickname is the Land of Echoes, and within range of its Genesis Nexus, Echoes can take physical form without Terminals."
},
{
"name": "Order of the Deep",
"text": "Ragunna's ruling church, founded by the first Primus Napoli II, which controls all Terminals and Echoes and preaches Salvation, Ascension and Unity. Its doctrine was quietly corrupted by Leviathan and parts of it worked with the Fractsidus; Primus Fenrico is revealed as the Threnodian's Harbinger in 2.5 and dies in 2.7 holding back the Dark Tide, leaving the seat empty."
},
{
"name": "Montelli and Fisalia families",
"text": "Two of Ragunna's great houses. The Montellis, led by Carlotta, are merchants who rose from third-rate status, opened Rinascita's sea routes, developed Reserved Terminals and invited Rover to the Carnevale through the Black Shores. The Fisalias, led by their 36th matriarch Cantarella, are an ancient house of medicine and poison, founders of the Ark and keepers of the sword Tyrvine, who lived under Leviathan's whispers until Imperator freed them in 2.2."
},
{
"name": "Septimont",
"text": "Rinascita's martial city-state, founded by settlers Imperator led, which later turned away from the Sentinel in favor of human strength and honors the Lioness of Glory, Arsinosa. Gladiatorial Agons can decide who holds power; it is led by the Ephor Augusta, and the moon-reading Priestesses of Tetragon Temple, including Iuno, foretell its fate."
},
{
"name": "Lahai-Roi",
"text": "A warm underground nation beneath the polar Roya Frostlands, lit by an artificial digital sky and, since 3.0, the man-made sun Helios. It is shared by the indigenous Roya Tribe, led by the calendar-keeping elders of the Heliodic Six, and the multinational Spacetrek Collective, and its only wildlife is the mechanical Exoswarm. Aleph-1's Void Storm often cuts it off from the rest of the world."
},
{
"name": "Spacetrek Collective and Startorch Academy",
"text": "A non-profit scientific body founded by several nations, first as the Polar Collective, to study the Exostrider and restart space travel. Its Startorch Academy, a borderless academic city led by President Lucilla, trains Synchronists to resonate with the Exostrider; it depends on New Federation investors, and in 3.4 Lucilla has to defend the Synchronist program before them."
},
{
"name": "New Federation",
"text": "A technology-driven superpower with aircraft, aerospace companies and a rigid class system that runs down to the exiles of its Lawless Zone. The Fractsidus have infiltrated its upper ranks and draw funding from it, and it keeps a Sentinel as a research subject. No New Federation region has been released as of 3.7, though its investors dominate the Spacetrek Collective's board."
},
{
"name": "Ashinohara",
"text": "A walled, floating island nation that distrusted Resonators, kept watch lists and suppression devices, and relied on a line of miko (shrine maidens) against its Threnodian. Its Honami City was lost to a regional Lament decades ago, and by 3.3 the whole nation has vanished in a single day for reasons not yet explained."
}
],
"mysteries": [
{
"q": "What is the Lament, and what causes it?",
"text": "The game shows what the Lament does: it rewrites physics, turns matter and memory into frequencies, and leaves Tacet Discords and Waveworn Phenomena behind. What it is and where it comes from are unrevealed; in-game, only the Tethys System is said to understand it. Resolution K626 warns of time ripples converging on the present and of an event being cut off from its causes, which hints the Lament is tied to time and causality, and the alien Threnodians suggest it may not be confined to Solaris-3. Anything beyond that, such as a link to Rover's homeland, is unconfirmed speculation.",
"since": "Open since 1.0; sharpened in 1.3 and 3.3"
},
{
"q": "Why did Rover erase their own memory?",
"text": "Rover gave up their memories about 20 years ago, apparently as part of a long-term plan against the Lament; Phrolova accuses them of doing it for another chance at solving it, and Rover does not deny it. The game has not explained what the plan is, what the past Rover's message says, or why Rover's face appears in a recording of the Etheric Sea's arrival about 10,000 years ago. Whether Rover has lived continuously for 10,000 years or is caught in some kind of loop is unconfirmed fan theory.",
"since": "Open since 1.0; sharpened in 1.3, 2.5 and 3.1"
},
{
"q": "Who is Instance One, and who gave Rover the Tacet Mark?",
"text": "Resolution K626 activates two agents, Instance One for time and Instance Two for space. The Shorekeeper is confirmed as the Second Instance, and in 3.6 a voice inside Mengzhou's Civilization Capsule announces that the First Instance has been activated, the same voice Rover heard in Rinascita's Capsule. Instance One is unidentified: fan theories point to Rover or to the Mysterious Woman in a silver dress who marks Rover in the prologue, but neither is confirmed.",
"since": "Open since 1.0; sharpened in 1.3 and 3.6"
},
{
"q": "Who is the Grand Architect, and what do they want?",
"text": "Schwarzloch leads the Fractsidus and can wear anyone's face; known guises include Triss, Kharon, Nivora and Luuk Herssen's father, and the oldest is Weiying, a SkyArk researcher from about 10,000 years ago who saw the Etheric Sea as a way to reach somewhere beyond. In 2.7 they tell Rover their paths were never truly opposed, and in 3.3 Denia reveals that shapeshifting is not their true Forte. Their real identity, power and endgame, and how much they know about Rover's origin, remain unknown.",
"since": "Open since 2.5; sharpened in 2.7, 3.1 and 3.3"
},
{
"q": "What is Abby?",
"text": "Abby lives in Rover's Tacet Mark, keeps Rover's frequency stable and absorbs harmful energy, and Jué once suggested it might be a being like Jué itself. Leviathan calls it Abraxas and asks why Abraxas betrayed them, and Cristoforo claims it holds Ovathrax's dormant power. Whether Abby is a Threnodian, part of one or something else is unconfirmed, and the Shorekeeper's 1.3 warning about Abby's anomalies has not been fully explained.",
"since": "Open since 1.0; sharpened in 1.3 and 2.7"
},
{
"q": "Why did Rover's homeland cut them off, and what else is out in space?",
"text": "In 3.1 Aemeath finds Rover's old messages home in a satellite inside Voidspace, along with the homeland's refusal to let them return. It is unknown whether the Homeland Civilization is unwilling or unable to make contact, or what exactly it sent Rover to do. The alien Threnodians Aleph-1 and the White Tower show that threats come from beyond Solaris-3, Aleph-1's banishment in 3.3 is described as only temporary, and a Farwatcher recording that Lucilla presents in 3.4 hints that Solaris-3 is not alone in the universe.",
"since": "Open since 3.1; sharpened in 3.3 and 3.4"
},
{
"q": "What are the Civilization Capsules really for?",
"text": "Each Sentinel keeps a Civilization Capsule of legacy data about Sentinels and civilization, able to simulate and reconstruct future possibilities. Rinascita's carried Imperator's last message in 2.7, and Mengzhou's runs Xuanfang Hold and contains base code ordering the Hold destroyed once its mission is done. Leviathan, Muyu and Balanophora all wanted them, the Fractsidus stole pieces of Mengzhou's (Hsin says they can no longer use them), and the 3.6 First Instance message suggests a link to Resolution K626, but their full purpose is unrevealed.",
"since": "Open since 2.6; sharpened in 3.6 and 3.7"
},
{
"q": "Where is Ovathrax, and what happens when Jué dies?",
"text": "Ovathrax, the Threnodian of War, is defeated in Jinzhou in 1.0 but escapes, and its location is unknown; Hsin says in 3.7 that Mengzhou keeps many protections and the Threnodian is not an immediate threat. Jué survived 1.1 but lost part of its power and is slowly dying, and its death would release time disruptions on Jinzhou. Cristoforo's claim that Abby holds Ovathrax's dormant power ties this thread to Rover directly.",
"since": "Open since 1.0; sharpened in 1.1 and 3.7"
},
{
"q": "What is going on inside Huanglong?",
"text": "3.7 ends with Hsin and Suoming setting out for Mengzhou City with a small team, agreeing they all have scores to settle there. Balanophora is still at large and looking for a way to restore herself, Mengzhou City Hall has kept a suspicious distance from Xuanfang, the Zhuojun Atelier is under investigation, and Hsin says the Moon Fox's assassination was hushed up by those above. Suoming adds that Mingting has long run a project for the Huanglong Sentinels, and Yangyang's new title, Votary of the Voice, is still unexplained.",
"since": "Open since 3.5; sharpened in 3.6 and 3.7"
},
{
"q": "What happened to Ashinohara?",
"text": "Ashinohara, a floating island nation hostile to Resonators, vanished in a single day shortly before 3.3. Its recurring Threnodian, which the nation held off with its miko, and the Fractsidus Overseer Zashiki-warashi are implicated, and the Grand Architect has been meddling with its miko line, but no cause has been confirmed. Hiyuki, the current Miko of Flaming Sakura, and Platya of the Black Shores are among the few Ashinohara natives in the story.",
"since": "Open since 3.3"
}
],

"text": "A further awakening that pushes a Resonator's power past its normal limits. The Fractsidus pursue it as a power to rival the Sentinels (1.1), and Xuanqing's fatal Second Awakening 200 years ago normally needed the Arbiter's authorization (3.7)."

{
"term": "Tethys System",
"text": "The Black Shores' supercomputer, a civilization simulation table that models Laments and warns of them 24 to 48 hours ahead. Made by an unknown civilization, it is said to be the only thing that understands the Lament's true nature."
},
{
"term": "True Lament",
"text": "The Fractsidus' name for the next Lament, which they intend to bring about by reviving Threnodians."
},
{
"term": "Void Storm",
"text": "Lahai-Roi's Waveworn Phenomenon and the power of Aleph-1. It dissolves its victims and erases them from memory, and it often cuts the nation off from the outside world."
},
{
"term": "Voidspace",
"text": "A higher-dimensional space inside Aleph-1's Voidmatter where time and space are nonlinear. It holds the remains of civilizations Aleph-1 destroyed, and Aemeath travels through time there."
},
{
"term": "White Tower",
"text": "An alien Threnodian that came from space and destroyed an ancient civilization. Its remains are imprisoned in the layers of the Somnoire."
},
{
"term": "Xuanfang Hold",
"text": "A suspended, mechanized fortress-city that traps Tacet Discords from the Norfall Barrens, built 200 years ago by the Court of Savantae with Hsin on the ruins of Yuan Fortress. Its base code required its destruction once its mission ended, until Hsin overrode that in 3.7."
}
]

<script>
(function(){
  const D = window.WUWA, U = D.ui, FA = D.meta.lang === 'fa', RTL = D.meta.dir === 'rtl';
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const en = s => '<bdi dir="ltr">' + esc(s) + '</bdi>';              // English-only text inside a possibly RTL line
  /* prose: keep hyphenated English names on one line; in RTL, an RLM after «،»/«؛» stops two English words from merging into one reversed run */
  const tx = s => {
    let h = esc(s);
    if (RTL) h = h.replace(/([\u060C\u061B])(\s*)(?=[A-Za-z0-9])/g, '$1\u200F$2');
    return h.replace(/[A-Za-z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)+/g, m => '<span class="nw">' + m + '</span>');
  };
  const paras = s => String(s || '').split(/\n\s*\n/).map(p => '<p>' + tx(p.trim()) + '</p>').join('');
  const num = s => FA ? String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(s);   // a plain dot reads better than ٫ at display sizes
  const tpl = (s, o) => String(s).replace(/\{(\w+)\}/g, (_, k) => o[k]);
  const slug = v => 'v' + String(v).replace(/\./g, '-');
  const arcs = D.arcs, patches = D.patches;
  const arcById = Object.fromEntries(arcs.map(a => [a.id, a]));
  const fmt = d => d ? new Date(d + 'T12:00:00Z').toLocaleDateString(D.meta.locale, {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'}) : '';
  const fmtAlt = d => D.meta.altLocale && d ? new Date(d + 'T12:00:00Z').toLocaleDateString(D.meta.altLocale, {day:'numeric', month:'long', year:'numeric', timeZone:'UTC'}) : '';
  /* the visitor's own date, so "Today" and "Live now" stay true between updates */
  const TODAY = new Date().toISOString().slice(0, 10);
  const WAVE_END = TODAY > D.meta.waveEnd ? TODAY : D.meta.waveEnd;
  if (D.meta.alt) { const l = $('#langSwitch'); l.href = D.meta.alt.href; l.hreflang = D.meta.alt.lang; l.lang = D.meta.alt.lang; l.textContent = D.meta.alt.label; l.hidden = false; }

  /* artwork: each embedded file becomes one blob URL on first use, shared by every place that shows it */
  const IM = window.WUWA_IMG || {files:{}, keys:{}, card:[]};
  const CARD = new Set(IM.card), blobs = {};
  const imgUrl = key => {
    const f = IM.keys[key]; if (!f) return '';
    if (IM.base) return IM.base + f;                          // website: images are separate files
    if (!blobs[f]) {
      const [mime, b64] = IM.files[f], bin = atob(b64), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      blobs[f] = URL.createObjectURL(new Blob([u8], {type:mime}));
    }
    return blobs[f];
  };
  const pic = (key, alt, cls) => { const u = imgUrl(key); return u ? '<img' + (cls ? ' class="' + cls + '"' : '') + ' src="' + u + '" alt="' + esc(alt || '') + '" loading="lazy" decoding="async" draggable="false">' : ''; };
  const avatar = name => {
    const u = imgUrl('char:' + name);
    if (!u) return '<span class="av av-mono" aria-hidden="true">' + esc(name.replace(/^The /, '').charAt(0)) + '</span>';
    return '<span class="av' + (CARD.has(name) ? '' : ' av-npc') + '" aria-hidden="true"><img src="' + u + '" alt="" loading="lazy" decoding="async" draggable="false"></span>';
  };

  /* static interface text */
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = U[n.dataset.t]; });
  document.querySelectorAll('[data-t-placeholder]').forEach(n => { n.placeholder = U[n.dataset.tPlaceholder]; });
  document.querySelectorAll('[data-t-aria]').forEach(n => { n.setAttribute('aria-label', U[n.dataset.tAria]); });

  /* watermark: keep it in place even if someone deletes the node */
  const ensureMark = () => { if (!document.querySelector('body > .wm')) { const m = document.createElement('div'); m.className = 'wm'; m.setAttribute('aria-hidden', 'true'); document.body.prepend(m); } };
  ensureMark();
  new MutationObserver(ensureMark).observe(document.body, {childList:true});
  document.addEventListener('copy', e => {
    const sel = String(getSelection() || '');
    if (sel.length < 40 || !e.clipboardData) return;
    e.clipboardData.setData('text/plain', sel + '\n\n' + U.copyAttribution);
    e.preventDefault();
  });

  /* theme toggle */
  const root = document.documentElement;
  try { const t = localStorage.getItem('wuwa-theme'); if (t) root.dataset.theme = t; } catch(e){}
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const tt = $('#themeToggle');
  const label = () => { tt.textContent = isDark() ? U.themeToLight : U.themeToDark; };
  label();
  tt.addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('wuwa-theme', root.dataset.theme); } catch(e){}
    label();
  });

  /* hero copy */
  $('#heroSub').textContent = D.meta.subtitle;
  $('#heroLede').innerHTML = tx(D.meta.lede);
  $('#worldIntro').innerHTML = tx(D.lore.intro);
  $('#threadsIntro').innerHTML = tx(D.lore.threadsIntro);

  /* ---------- wave ---------- */
  const svg = $('#wave'), NS = 'http://www.w3.org/2000/svg';
  svg.setAttribute('aria-label', U.waveAria);
  const MID = 110;
  const t0 = Date.parse(D.meta.waveStart), t1 = Date.parse(WAVE_END);
  const dirx = RTL ? -1 : 1;                                   // time runs right to left in Persian
  const mk = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anchorStart = RTL ? 'end' : 'start', anchorEnd = RTL ? 'start' : 'end';
  const caption = $('#waveCaption');
  const defaultCaption = () => { caption.innerHTML = '<span><strong>' + esc(tpl(U.capVersions, {n:num(patches.length)})) + '</strong> ' + esc(tpl(U.capFrom, {date:fmt(patches[0].start)})) + '</span><span>' + esc(U.capHint) + '</span>'; };
  defaultCaption();

  /* Narrow screens draw on a narrower canvas so the wave keeps its height; text is sized in screen pixels
     and version labels are thinned so they never collide. Redraws only when the canvas width changes. */
  let lastW = 0, animated = false;
  const drawWave = () => {
    const cw = svg.getBoundingClientRect().width;
    if (!cw) return;
    const W = Math.round(Math.min(1200, Math.max(560, cw * 1.5)));
    if (W === lastW) return;
    lastW = W;
    const k = W / cw, X0 = 14, X1 = W - 14;
    const X = d => { const f = (Date.parse(d) - t0) / (t1 - t0); return RTL ? X1 - f * (X1 - X0) : X0 + f * (X1 - X0); };
    const txt = (cls, x, y, anchor, s, px) => { const t = mk('text', {x, y, class:cls, 'text-anchor':anchor}); t.style.fontSize = (px * k).toFixed(1) + 'px'; t.textContent = s; return t; };
    const tickPx = FA ? 11.5 : 10.5, rowH = tickPx * k * (FA ? 1.75 : 1.3);
    const H = Math.round(214 + rowH + 6);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.replaceChildren();

    [2025, 2026].forEach(y => {
      const x = X(y + '-01-01');
      svg.append(mk('line', {x1:x, x2:x, y1:4, y2:196, class:'year-line'}));
      svg.append(txt('tick-label', x + 5 * k * dirx, 14, anchorStart, num(y), tickPx));
    });
    svg.append(txt('tick-label', RTL ? X1 : X0, 14, anchorStart, num(2024), tickPx));
    const sig = txt('sig', RTL ? X0 : X1, 14, anchorEnd, '© Miyano', 11);
    svg.append(sig);

    const labels = [], minGap = tickPx * k * 2.8;
    patches.forEach((p, i) => {
      const a = arcById[p.arc];
      const xs = X(p.start), xe = X(p.end && p.end <= WAVE_END ? p.end : WAVE_END);
      const amp = 10 + (p.weight || 2) * 14;
      const cycles = Math.max(3, Math.round((a.cycles || 6) * Math.min(1, W / 1100)));
      const span = Math.abs(xe - xs);
      let d = '';
      for (let px = 0; px <= span; px += 1.2) {
        const u = px / span;
        const env = Math.pow(Math.sin(Math.PI * u), 0.9);
        const y = MID - amp * env * Math.sin(2 * Math.PI * u * cycles);
        d += (px === 0 ? 'M' : 'L') + (xs + px * dirx).toFixed(1) + ' ' + y.toFixed(1);
      }
      const g = mk('g', {class:'pulse-group', 'data-v':p.v});
      const path = mk('path', {d, class:'pulse', stroke:'var(--' + a.color + ')'});
      g.append(path);
      const hit = mk('rect', {x:Math.min(xs, xe), y:MID - 90, width:Math.max(span, 6), height:180, class:'pulse-hit', tabindex:0, role:'link', 'aria-label':U.versionWord + ' ' + num(p.v) + ': ' + p.title});
      g.append(hit);
      svg.append(g);
      labels.push({x:xs + 2 * k * dirx, s:num(p.v)});
      if (!reduce && !animated) {
        path.style.setProperty('--len', path.getTotalLength());
        path.style.setProperty('--delay', (i * 0.07) + 's');
        path.classList.add('draw');
      }
      const show = () => {
        svg.querySelectorAll('.pulse-group').forEach(n => n.classList.toggle('dim', n !== g));
        g.classList.add('hot');
        caption.innerHTML = '<span><strong>' + esc(num(p.v)) + ' ' + en(p.title) + '</strong></span><span>' + tx(p.region || a.name) + '</span><span>' + esc(fmt(p.start)) + '</span>';
      };
      const hide = () => { svg.querySelectorAll('.pulse-group').forEach(n => n.classList.remove('dim', 'hot')); defaultCaption(); };
      const go = () => { const t = document.getElementById(slug(p.v)); if (t) { t.scrollIntoView(); history.replaceState(null, '', '#' + slug(p.v)); } };
      hit.addEventListener('mouseenter', show); hit.addEventListener('focus', show);
      hit.addEventListener('mouseleave', hide); hit.addEventListener('blur', hide);
      hit.addEventListener('click', go);
      hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    /* keep the first and latest version labelled, thin the rest */
    const keep = [];
    labels.forEach((l, i) => {
      if (!keep.length || Math.abs(l.x - keep[keep.length - 1].x) >= minGap) keep.push(l);
      else if (i === labels.length - 1) { keep.pop(); keep.push(l); }
    });
    keep.forEach(l => svg.append(txt('tick-label', l.x, 214, anchorStart, l.s, tickPx)));

    const nowX = X(TODAY);
    svg.append(mk('line', {x1:nowX, x2:nowX, y1:30, y2:196, class:'now-line'}));
    svg.append(txt('now-label', nowX - 4 * k * dirx, 214 + rowH, anchorEnd, U.today, FA ? 12 : 11));
    /* on narrow screens the signature can run into a year label; the page watermark covers it there */
    const sb = sig.getBBox();
    if ([...svg.querySelectorAll('text.tick-label')].some(t => { const b = t.getBBox(); return b.x < sb.x + sb.width && sb.x < b.x + b.width && b.y < sb.y + sb.height && sb.y < b.y + b.height; })) sig.remove();
    animated = true;
  };
  drawWave();
  if ('ResizeObserver' in window) new ResizeObserver(drawWave).observe(svg);
  else addEventListener('resize', drawWave);

  $('#waveLegend').innerHTML = arcs.map(a => '<li style="--c:var(--' + a.color + ')"><i></i>' + en(a.name) + ' <span style="color:var(--muted)">' + tx(a.range) + '</span></li>').join('');

  /* ---------- world primer ---------- */
  $('#primer').innerHTML = D.lore.concepts.map(c => '<div class="concept"><h3>' + en(c.term) + '</h3><p>' + tx(c.text) + '</p></div>').join('');
  $('#deepTime').innerHTML = D.lore.chronology.map(e => '<li class="' + (e.lament ? 'lament' : '') + '"><div class="when">' + tx(e.when) + '</div><h3>' + tx(e.title) + '</h3><p>' + tx(e.text) + '</p></li>').join('');
  $('#sentinels').innerHTML = D.lore.sentinels.map(s => '<article class="sentinel" style="--c:var(--' + (s.color || 'c-lore') + ')"><h4>' + tx(s.name) + '</h4><div class="of">' + tx(s.of) + '</div><p>' + tx(s.text) + '</p></article>').join('');
  $('#factions').innerHTML = D.lore.factions.map(f => '<div class="faction"><h4>' + tx(f.name) + '</h4><p>' + tx(f.text) + '</p></div>').join('');

  /* ---------- stream ---------- */
  const castIndex = new Map();
  const addCast = (name, v) => { const k = name.trim(); if (!k) return; if (!castIndex.has(k)) castIndex.set(k, new Set()); castIndex.get(k).add(v); };

  const stream = $('#stream');
  let html = '';
  arcs.forEach(a => {
    const ps = patches.filter(p => p.arc === a.id);
    html += '<section class="arc" id="arc-' + a.id + '" style="--c:var(--' + a.color + ')" aria-labelledby="arc-h-' + a.id + '">';
    html += '<header class="arc-head">' + (imgUrl('arc:' + a.id) ? '<figure class="arc-art">' + pic('arc:' + a.id, tpl(U.altRegion, {name:a.name})) + '</figure>' : '') + '<p class="arc-kicker">' + tx(a.kicker) + '</p><h2 id="arc-h-' + a.id + '">' + en(a.name) + '</h2><p>' + tx(a.text) + '</p>';
    if (a.places && a.places.length) html += '<ul class="arc-places" aria-label="' + esc(U.keyPlaces) + '">' + a.places.map(pl => '<li>' + tx(pl) + '</li>').join('') + '</ul>';
    html += '</header>';
    ps.forEach(p => {
      (p.cast || []).forEach(n => addCast(n, p.v));
      const live = (p.start <= TODAY && (!p.end || TODAY <= p.end)) ? '<span class="live">' + esc(U.liveNow) + '</span>' : '';
      const alt = fmtAlt(p.start);
      html += '<article class="patch" id="' + slug(p.v) + '" data-v="' + esc(p.v) + '">';
      html += '<header class="patch-head"><p class="vnum" aria-hidden="true">' + esc(num(p.v)) + '</p><div><h3 class="ptitle"><span class="vh">' + esc(U.versionWord + ' ' + num(p.v)) + ': </span>' + en(p.title) + '</h3>';
      if (p.title_fa) html += '<p class="ptitle-fa">' + tx(p.title_fa) + '</p>';
      html += '<p class="pmeta"><span' + (alt ? ' title="' + esc(alt) + '"' : '') + '>' + esc(fmt(p.start)) + (p.end ? esc(U.dateTo) + esc(fmt(p.end)) : '') + '</span>' + (p.region ? '<span>' + tx(p.region) + '</span>' : '') + live + '</p></div></header>';
      if (imgUrl('ver:' + p.v)) html += '<figure class="pbanner">' + pic('ver:' + p.v, tpl(U.altKeyArt, {v:num(p.v), title:p.title})) + '</figure>';
      html += '<p class="logline">' + tx(p.logline) + '</p>';
      if (p.introduced && p.introduced.length) {
        html += '<div class="cast"><h4>' + esc(U.newFaces) + '</h4><ul>' + p.introduced.map(c => '<li><button type="button" class="chip" data-name="' + esc(c.key || c.name) + '" title="' + esc(tpl(U.followName, {name:c.key || c.name})) + '">' + avatar(c.key || c.name) + '<span class="chip-t">' + en(c.name) + '<small>' + tx(c.role) + '</small></span></button></li>').join('') + '</ul></div>';
      }
      if (p.quests && p.quests.length) {
        html += '<div class="quests">' + p.quests.map(q => '<details class="quest"><summary><span class="qcode">' + tx(q.code) + '</span><span class="qname">' + en(q.name) + '</span></summary><div class="qbody">' + paras(q.synopsis) + '</div></details>').join('') + '</div>';
      }
      if (p.reveals && p.reveals.length) html += '<div class="block reveals"><h4>' + esc(U.whatWeLearn) + '</h4><ul>' + p.reveals.map(r => '<li>' + tx(r) + '</li>').join('') + '</ul></div>';
      if (p.side && p.side.length) html += '<div class="block side"><h4>' + esc(U.alongside) + '</h4><ul>' + p.side.map(s => '<li><b>' + en(s.name) + (FA ? ':' : '.') + '</b> ' + tx(s.text) + '</li>').join('') + '</ul></div>';
      if (p.leaves) html += '<aside class="leaves"><h4>' + esc(U.leaves) + '</h4><p>' + tx(p.leaves) + '</p></aside>';
      if (p.note) html += '<p class="note">' + tx(p.note) + '</p>';
      html += '</article>';
    });
    html += '</section>';
  });
  stream.innerHTML = html;

  /* rail */
  $('#railArcs').innerHTML = arcs.map(a => {
    const ps = patches.filter(p => p.arc === a.id);
    return '<li class="rail-arc" style="--c:var(--' + a.color + ')"><a href="#arc-' + a.id + '">' + en(a.name) + '</a><ol>' + ps.map(p => '<li><a href="#' + slug(p.v) + '" data-v="' + esc(p.v) + '"><b>' + esc(num(p.v)) + '</b><span>' + tx(p.short || p.title) + '</span></a></li>').join('') + '</ol></li>';
  }).join('');
  const railLinks = [...document.querySelectorAll('.rail-arc li a')];
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const v = en.target.dataset.v;
        railLinks.forEach(l => {
          const on = l.dataset.v === v;
          l.classList.toggle('active', on);
          if (on && matchMedia('(max-width:999px)').matches) {
            const nav = l.closest('nav'), lr = l.getBoundingClientRect(), nr = nav.getBoundingClientRect();
            nav.scrollLeft += (lr.left + lr.width / 2) - (nr.left + nr.width / 2);
          }
        });
      }
    });
  }, {rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('.patch').forEach(n => io.observe(n));

  /* expand all */
  const ex = $('#expandAll');
  ex.addEventListener('click', () => {
    const open = ex.getAttribute('aria-pressed') !== 'true';
    document.querySelectorAll('.quest').forEach(d => d.open = open);
    ex.setAttribute('aria-pressed', open);
    ex.textContent = open ? U.closeAll : U.openAll;
  });

  /* follow a character */
  const names = [...castIndex.keys()].sort((a, b) => castIndex.get(b).size - castIndex.get(a).size || a.localeCompare(b));
  $('#castList').innerHTML = names.map(n => '<option value="' + esc(n) + '"></option>').join('');
  const fi = $('#followInput'), fc = $('#followClear'), fr = $('#followResult');
  const follow = name => {
    const key = names.find(n => n.toLowerCase() === String(name).trim().toLowerCase());
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', !!key && c.dataset.name === key));
    if (!key) {
      document.body.classList.remove('following');
      document.querySelectorAll('.patch.match, .rail-arc a.match').forEach(n => n.classList.remove('match'));
      fc.hidden = !fi.value; fr.textContent = fi.value ? U.followNone : '';
      return;
    }
    const vs = castIndex.get(key);
    document.body.classList.add('following');
    document.querySelectorAll('.patch').forEach(n => n.classList.toggle('match', vs.has(n.dataset.v)));
    railLinks.forEach(l => l.classList.toggle('match', vs.has(l.dataset.v)));
    fc.hidden = false;
    fr.innerHTML = tpl(esc(vs.size === 1 ? U.followOne : U.followMany), {name:en(key), n:esc(num(vs.size))});
  };
  fi.addEventListener('input', () => follow(fi.value));
  fc.addEventListener('click', () => { fi.value = ''; follow(''); fi.focus(); });
  stream.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const same = fi.value === c.dataset.name;
    fi.value = same ? '' : c.dataset.name; follow(fi.value);
  });

  /* cast gallery: everyone with official art, grouped by the chapter they debut in; playable characters first */
  const debut = new Map(), roleOf = new Map();
  patches.forEach(p => {
    (p.cast || []).forEach(n => { if (!debut.has(n)) debut.set(n, p); });
    (p.introduced || []).forEach(c => { const k = c.key || c.name; if (!roleOf.has(k)) roleOf.set(k, c.role); });
  });
  const people = [...debut.keys()].filter(n => IM.keys['char:' + n]);
  const playable = n => CARD.has(n);
  let showAll = false;
  const drawCast = () => {
    $('#castGallery').innerHTML = arcs.map(a => {
      const list = people.filter(n => debut.get(n).arc === a.id && (showAll || playable(n)))
        .sort((x, y) => (playable(y) - playable(x)) || patches.indexOf(debut.get(x)) - patches.indexOf(debut.get(y)));
      if (!list.length) return '';
      return '<div class="cast-group" style="--c:var(--' + a.color + ')"><h3 class="subhead">' + en(a.name) + '</h3><ul class="cast-grid">' + list.map(n => {
        const p = debut.get(n), role = roleOf.get(n) || '';
        return '<li><button type="button" class="ccard' + (playable(n) ? '' : ' ccard-npc') + '" data-name="' + esc(n) + '" title="' + esc(tpl(U.followName, {name:n})) + '"><span class="ccard-img">' + pic('char:' + n, n) + '</span><span class="ccard-name">' + en(n) + '</span>' + (role ? '<span class="ccard-role">' + tx(role) + '</span>' : '') + '<span class="ccard-debut">' + esc(tpl(U.debut, {v:num(p.v)})) + '</span></button></li>';
      }).join('') + '</ul></div>';
    }).join('');
    const more = $('#castMore'), extra = people.filter(n => !playable(n)).length;
    more.hidden = !extra;
    more.textContent = showAll ? U.castFewer : tpl(U.castAll, {n:num(extra)});
    more.setAttribute('aria-expanded', showAll);
  };
  drawCast();
  $('#castMore').addEventListener('click', () => { showAll = !showAll; drawCast(); });
  $('#castGallery').addEventListener('click', e => {
    const c = e.target.closest('.ccard'); if (!c) return;
    fi.value = c.dataset.name; follow(fi.value);
    const first = document.querySelector('.patch.match');
    (first || $('#story')).scrollIntoView();
  });

  /* mysteries, glossary, sources, footer */
  $('#mysteries').innerHTML = D.lore.mysteries.map(m => '<article class="mystery"><h3>' + tx(m.q) + '</h3><p>' + tx(m.text) + '</p>' + (m.since ? '<div class="since">' + tx(m.since) + '</div>' : '') + '</article>').join('');
  $('#glossaryList').innerHTML = D.lore.glossary.map(g => '<div><dt>' + en(g.term) + (g.term_fa ? '<span class="tfa">' + tx(g.term_fa) + '</span>' : '') + '</dt><dd>' + tx(g.text) + '</dd></div>').join('');
  $('#sourceList').innerHTML = D.sources.map(s => '<li><a href="' + esc(s.url) + '" rel="noopener" target="_blank">' + en(s.label) + '</a></li>').join('');
  $('#foot').innerHTML = '<p class="rights">' + tx(U.rights) + '</p><p>' + tx(U.imgCredit) + '</p><p>' + tx(D.meta.footer) + '</p>';

  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView(), 50); }
})();
</script>
</body>
</html>
